q:()=>`<h3>📜 Missões</h3>`+MS.map((q,i)=>{const ok=q[1](),cl=G.m[i];return`<div class="it"><div class="tx"><b>${cl?'✅ ':''}${q[0]}</b><br><small>Recompensa: ${chips2(q[2],1)} +${q[3]} XP</small></div>${cl?'':`<button class="b ok" ${ok?'':'disabled'} onclick="claim(${i})">${ok?'Receber':'Em andamento'}</button>`}</div>`}).join('')+X,
t:()=>`<h3>🛡️ Batalha</h3><small>Tropas disponíveis: ${army()}. Vitórias liberam a próxima fase.</small>`+S.map((s,i)=>`<div class="it"><div class="ic">${Object.keys(s.e).map(k=>E[k].i).join('')}</div><div class="tx"><b>${s.n}</b><br><small>${Object.keys(s.e).map(k=>s.e[k]+'× '+E[k].n).join(', ')}<br>Prêmio: ${chips2(s.r,1)} +${s.x} XP${s.leg?' + ⭐ '+U[s.leg].n+' (lendária)':''}</small></div><button class="b" ${i>G.st?'disabled':''} onclick="startBattle(${i})">${i>G.st?'🔒':i<G.st?'Repetir':'Atacar'}</button></div>`).join('')+X,
c:()=>`<h3>⚙️ Opções</h3><div class="r"><button class="b" onclick="gfxNext()">🎨 Gráficos: ${['Baixo','Médio','Alto'][GFX]}</button><button class="b ${DEV.on?'ok':'gr'}" onclick="devToggle()">🛠 Modo Desenvolvedor: ${DEV.on?'LIGADO':'desligado'}</button><button class="b" onclick="G.snd=G.snd?0:1;render()">Som: ${G.snd?'ligado':'desligado'}</button><button class="b" onclick="save();toast(DEV.on?'Modo Desenvolvedor: nada é salvo.':'Jogo salvo.')">Salvar agora</button><button class="b" onclick="skipPhase();toast('Período do dia avançado.')">⏭ Próximo período do dia</button></div>
<p><small>${saveErr?'⚠ Salvamento indisponível neste navegador (modo privado?). ':'✅ Último salvamento: '+new Date(saveAt||now()).toLocaleTimeString('pt-BR')+'. '}O jogo salva sozinho a cada 5 segundos e após cada ação, neste navegador (sem sincronização entre aparelhos). Para jogar em tela cheia no iPhone: botão Compartilhar › Adicionar à Tela de Início.</small></p>
<div class="r"><button class="b gr" onclick="ask('Apagar todo o progresso?',()=>{localStorage.removeItem('ra1');G=novo();sel=-1;toast('Novo jogo iniciado.')})">Reiniciar jogo</button></div>`+X};
const TT={h:'✏️ Stick Man',f:'⚗️ Cabana de Fusão',d:'🛠 Desenvolvedor',b:'🏗️ Construir',a:'⚔️ Exército',q:'📜 Missões',t:'🛡️ Batalha',c:'⚙️ Opções'};
function render(){const y=cd.scrollTop;cd.innerHTML=`<div class="hd"><h3>${TT[cur]}</h3><button class="b gr" onclick="closeM()">✕</button></div>`+MENU[cur]().replace(/<h3>.*?<\/h3>/,'').replace(X,'');cd.scrollTop=y;qv()}
function openM(t){if(BT&&!BT.end)return;cur=t;m.style.display='flex';render()}
function closeM(){if(BT&&!BT.end)return;m.style.display='none';cur=null;BT=null}
const m=$('m'),cd=$('cd');m.onclick=e=>{if(e.target==m)closeM()};
function claim(i){if(G.m[i]||!MS[i][1]())return;G.m[i]=1;add(MS[i][2]);xp(MS[i][3]);beep(800,.2);toast('Recompensa recebida!');render();save()}
/* ===== UTILIDADES e LOOP ===== */
function fx(t,g){const e=document.createElement('div');e.className='fx '+(g=='+'?'g':'r');e.textContent=g+' '+t;document.body.appendChild(e);setTimeout(()=>e.remove(),1300)}
let tt,AC;function toast(s){const e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2400)}
function beep(f=440,d=.08,ty='square'){if(!G.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
function hud(){const c=capac(),bad=now()<lackT;$('hud').innerHTML=R.map(k=>`<span class="rs${bad&&lack.includes(k)?' bad':''}">${RI[k]} <b>${Math.floor(G.r[k])}</b><i><u style="width:${Math.min(100,G.r[k]/c*100)}%"></u></i></span>`).join('')+`<span class="rs">👥 <b>${used()}/${popCap()}</b></span><span class="lv">⭐ Nv ${G.lv}<i><u style="width:${G.xp/(50*G.lv)*100}%"></u></i>${G.xp}/${50*G.lv} XP · 📦 ${c} · ${DAY.i[LT.ph]} ${DAY.n[LT.ph]} · 🏘 ${ERA[era()-1]} (capacidade ${popCap()}${era()<5?'/'+ER_T[era()-1]:''})</span>`}
let lt=performance.now();
setInterval(()=>{const t=performance.now(),dt=Math.min((t-lt)/1000,2);lt=t;tick(dt);npcSync();civUpdate();hud();qv();const b=G.b[sel],e=$('tl');if(b&&e)e.textContent=Math.max(0,Math.ceil((b.t-now())/1000))+'s';wall=now()},250);
setInterval(save,5000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{offline(wall);lt=performance.now();save()}});
addEventListener('resize',rs);addEventListener('orientationchange',()=>setTimeout(rs,250));if(window.visualViewport)visualViewport.addEventListener('resize',rs);document.addEventListener('touchmove',e=>{if(!e.target.closest('.card'))e.preventDefault()},{passive:false});addEventListener('pagehide',save);
rs();offline();save();cam.x=P(12,12)[0];cam.y=P(12,12)[1];hud();requestAnimationFrame(loop);setTimeout(()=>toast('Toque em 🏗️ Construir para começar.'),600);
</script></body></html>
